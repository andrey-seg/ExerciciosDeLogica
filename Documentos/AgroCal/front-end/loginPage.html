<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login agroCal</title>
    <link rel="stylesheet" href="./styles/colors/token.css">
    <link rel="stylesheet" href="./styles/global/logo.css">
    <link rel="stylesheet" href="./styles/login/loginImg.css">
    <link rel="stylesheet" href="./styles/glassmorpism/glass.css">
    <link rel="stylesheet" href="./styles/login/loginContainer.css">
    <link rel="stylesheet" href="./styles/buttons/neu-button.css">
    <link rel="stylesheet" href="./styles/checkBox/checkBox.css">
</head>
<body>
    <img
        class="app-logo"
        src="./imgs/icons/agroCalLogoOtimizada.png"
        alt="Logo AgroCal"
    />

    <main class="login-wrapper">
        <section class="card glass-card">
            <form id="login-form" action="/api/login" method="post">
                <h1>Entrar</h1>

                <label for="username">E-mail</label>
                    <input
                    type="email"
                    id="username"
                    name="username"
                    autocomplete="username"
                    placeholder="voce@exemplo.com"
                    required
                    autofocus
                    />

                <label for="password">Senha</label>
                    <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    minlength="8"
                    required
                    />

                <label class="container">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Lembrar de mim
                </label>

                    <button class="button2" type="submit">Entrar</button>

                <a href="/recuperar-senha">Esqueci minha senha</a>
            </form>
    </section>
</main>

</body>
</html>
